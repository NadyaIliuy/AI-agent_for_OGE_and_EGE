<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тренажёр ОГЭ — Hello, PyScript!</title>

    <!-- Стили PyScript 2024.11.1 -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css" />
    <!-- Движок PyScript 2024.11.1 (запускает Python прямо в браузере) -->
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>

    <!-- Наши собственные стили оформления -->
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    
<!-- СЛАЙД I: Стартовый экран -->
    <section id="slide-1" class="screen card">
        <h1>Тренажёр для ОГЭ и ЕГЭ</h1>
        <p>Добро пожаловать!</p>
        <button id="btn-start">Начать</button>
    </section>

    <!-- СЛАЙД II/1: Выбор экзамена (пока спрятан классом hidden!) -->
    <section id="slide-2-1" class="screen card hidden">
       <h2>Выбор экзамена:</h2>
        <button id="btn-new-oge">Новый вариант ОГЭ</button>
        <button id="btn-new-ege">Новый вариант ЕГЭ</button>
        <button id="btn-solved-oge">Прорешенные варианты ОГЭ</button>
        <button id="btn-solved-ege">Прорешенные варианты ЕГЭ</button>
        <button id="btn-back-to-1">← Назад</button>
    </section>   

    <!-- СЛАЙД III: Выбор дисциплины (11 предметов по макету) -->
    <section id="slide-3" class="screen card hidden">
    <h2 id="subjects-title">Выбор предмета:</h2>
    <div class="grid-subjects">
    <button class="btn-subject" data-subject="biology">Биология</button>
    <button class="btn-subject" data-subject="geography">География</button>
    <button class="btn-subject" data-subject="foreign">Английский язык</button>
    <button class="btn-subject" data-subject="informatics">Информатика</button>
    <button class="btn-subject" data-subject="history">История</button>
    <button class="btn-subject" data-subject="literature">Литература</button>
    <button class="btn-subject" data-subject="math">Математика</button>
    <button class="btn-subject" data-subject="social">Обществознание</button>
    <button class="btn-subject" data-subject="russian">Русский язык</button>
    <button class="btn-subject" data-subject="physics">Физика</button>
    <button class="btn-subject" data-subject="chemistry">Химия</button>
    </div>
    <p id="subject-notice" class="hidden"></p>
    <button id="btn-back-to-2">← Назад</button>
    </section>

    <script type="py" src="./main.py"></script>

</body>
</html>
